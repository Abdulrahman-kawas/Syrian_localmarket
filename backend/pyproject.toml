[project]
name = "localmarket-backend"
version = "0.1.0"
description = "LocalMarket API - Syrian Marketplace Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.25",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
    "geoalchemy2>=0.14.0",
    "shapely>=2.0.0",
    "pydantic[email]>=2.5.0",
    "pydantic-settings>=2.1.0",
    "bleach>=6.1.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.1.0",
    "python-multipart>=0.0.6",
    "httpx>=0.26.0",
    "azure-storage-blob>=12.19.0",
    "azure-identity>=1.15.0",
    "azure-keyvault-secrets>=4.7.0",
    "azure-communication-email>=1.0.0",
    "azure-communication-messages>=1.0.0",
    "Pillow>=10.2.0",
    "qrcode[pil]>=7.4",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "black>=24.0.0",
    "mypy>=1.8.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# NOTE: TCH (flake8-type-checking) is intentionally excluded — this is a
# FastAPI/Pydantic app where annotations are resolved at runtime, so imports
# used only in annotations must remain importable at runtime.
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "C4", "SIM"]
ignore = [
    "E501",   # line length handled by formatter
    "B008",   # FastAPI Depends() in argument defaults is idiomatic
    "A002",   # query params named `type`/`id` mirror the public API contract
    "UP042",  # (str, Enum) is intentional for stable value serialization
    "UP046",  # Generic[T] base is safer with Pydantic than PEP 695 params
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --cov=app --cov-report=term-missing"

[build-system]
requires = ["setuptools>=69.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
